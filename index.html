<!DOCTYPE html>
<html>
<head>
    <title>Ferramentas NFe</title>
    <style>
        body {
            background: #0f0c29;
            color: white;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .tools {
            display: flex;
            gap: 30px;
        }
        .tool {
            background: rgba(255,255,255,0.05);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            text-decoration: none;
            color: white;
            transition: all 0.3s;
        }
        .tool:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.1);
        }
        .tool .icon { font-size: 48px; }
        .tool h2 { margin: 10px 0; }
    </style>
</head>
<body>
    <div class="tools">
        <a href="limpeza-nfe.html" class="tool">
            <div class="icon">🧹</div>
            <h2>Limpeza NFe</h2>
            <p>Remove pontuação e formatação</p>
        </a>
        <a href="formatador-nfe.html" class="tool">
            <div class="icon">✨</div>
            <h2>Formatador NFe</h2>
            <p>Adiciona pontuação e formatação</p>
        </a>
    </div>
</body>
</html>
